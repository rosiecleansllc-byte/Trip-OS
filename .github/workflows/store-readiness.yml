name: Store readiness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Sharing privacy and revocation checks
        run: npm run test:sharing

      - name: Currency arithmetic and persistence checks
        run: node qa/currency.cjs

      - name: Screenshot extraction checks
        run: node qa/ocr-extraction.cjs

      - name: Itinerary import checks
        run: node qa/itinerary-import.cjs

      - name: PDF stream compatibility checks
        run: node qa/pdf-stream-compat.cjs

      - name: Typecheck and build
        run: npm run build
